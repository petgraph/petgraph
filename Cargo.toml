[workspace]
members  = ["crates/core", "crates/matrix_graph", "crates/petgraph"]
resolver = "3"

[workspace.package]
authors = [
    "Agustín Borgna <agustinborgna@gmail.com>",
    "Anton Kochkov <xvilka@gmail.com>",
    "Bilal Mahmoud <mahmoud@fastmail.com>",
    "Raoul Luqué <raoulsluque@gmail.com>",
    "bluss",
    "mitchmindtree",
    "starovoid <prototyperailgun@gmail.com>",
]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/petgraph/petgraph"
rust-version = "1.85"

[workspace.dependencies]
petgraph-core = { path = "crates/core", default-features = false }
# TODO: Change this to crates io, once new minor version is released.
petgraph-old  = { git = "https://github.com/petgraph/petgraph", branch = "0.8", package = "petgraph" }
petgraph-matrix-graph = { path = "crates/matrix_graph" }

fixedbitset = { version = "0.5.7", default-features = false }
foldhash    = { version = "0.2.0", default-features = false }
hashbrown   = { version = "^0.17.0", default-features = false }

[workspace.dev-dependencies]
petgraph-core         = { path = "crates/core", features = ["utils"] }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style   = { level = "warn", priority = -1 }

unreachable_pub = "warn"

# TODO: Enable `cargo` lints when supported
# [workspace.lints.cargo]

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

self_named_module_files = "warn"

alloc_instead_of_core = "warn"
min_ident_chars       = "warn"
std_instead_of_alloc  = "warn"
std_instead_of_core   = "warn"
