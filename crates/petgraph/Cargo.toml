[package]
name                   = "petgraph"
version                = "0.9.0"
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
edition.workspace      = true

description          = "Graph data structure library. Provides graph types and graph algorithms."
documentation        = "https://docs.rs/petgraph/"
repository.workspace = true

keywords   = ["data-structure", "graph", "unionfind", "graph-algorithms"]
categories = ["data-structures"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
petgraph-core       = { workspace = true}
petgraph-old        = { workspace = true, optional = true }
petgraph-algorithms = { workspace = true, optional = true }

[dev-dependencies]

[features]
std = ["alloc", "petgraph-core/std"]
alloc = ["petgraph-core/alloc", "petgraph-algorithms?/alloc"]
hashbrown = ["petgraph-core/hashbrown"]
petgraph-old = ["dep:petgraph-old"]
petgraph-algorithms = ["dep:petgraph-algorithms"]
default = ["std", "hashbrown", "petgraph-algorithms"]

[lints]
workspace = true

