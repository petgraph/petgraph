[package]
name                   = "petgraph-algorithms"
version                = "0.1.0"
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
petgraph-core = { workspace = true }

[dev-dependencies]
criterion     = { workspace = true, features = ["cargo_bench_support", "plotters"] }
petgraph-core = {workspace = true, features = ["test-utils", "alloc"]}

[features]
default = ["alloc"]
alloc   = ["petgraph-core/alloc"]

[[bench]]
name    = "max_flow"
harness = false
